<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tarefas — Luisa & Enzo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#17181a}
header{background:#fff;border-bottom:1px solid #e5e6ea;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:21px;margin:0}.wrap{max-width:1100px;margin:auto;padding:22px}button{border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}
.primary{background:#17181a;color:#fff}.ghost{background:#eceef1;color:#17181a}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.stat,.card,.login,.box{background:#fff;border:1px solid #e2e4e8;border-radius:14px;padding:15px}.num{font-size:28px;font-weight:800}.muted{color:#70747c;font-size:13px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.col{background:#eceef1;border-radius:14px;padding:12px;min-height:300px}.col h2{font-size:14px;margin:5px}
.card{margin:10px 0}.title{font-weight:800}.meta{font-size:12px;color:#70747c;margin-top:7px}.actions{display:flex;gap:7px;margin-top:11px}
.high{border-left:4px solid #c93b3b}.medium{border-left:4px solid #c89a25}.low{border-left:4px solid #4d8b5c}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}
.box{width:min(520px,100%)}input,textarea,select{width:100%;padding:11px;border:1px solid #d7d9de;border-radius:9px;margin:6px 0 12px;font:inherit}.login{max-width:420px;margin:80px auto;padding:28px}
@media(max-width:750px){.stats,.board{grid-template-columns:1fr}.wrap{padding:15px}}
</style></head>
<body>
<div id="login" class="login">
<h1>Tarefas — Luisa & Enzo</h1><p class="muted">Área privada</p>
<label>Quem está entrando?</label><select id="user"><option>Luisa</option><option>Enzo</option></select>
<label>Senha</label><input id="pass" type="password" placeholder="Senha">
<button class="primary" style="width:100%" onclick="doLogin()">Entrar</button><p id="msg" class="muted"></p>
</div>
<div id="app" style="display:none">
<header><h1>Tarefas — Luisa & Enzo</h1><div><span id="who"></span> <button class="ghost" onclick="logout()">Sair</button></div></header>
<div class="wrap">
<button class="primary" onclick="openM()">+ Nova tarefa</button>
<div class="stats">
<div class="stat"><div class="num" id="all">0</div><div class="muted">Todas</div></div>
<div class="stat"><div class="num" id="pn">0</div><div class="muted">Pendentes</div></div>
<div class="stat"><div class="num" id="dn">0</div><div class="muted">Em andamento</div></div>
<div class="stat"><div class="num" id="cn">0</div><div class="muted">Concluídas</div></div>
</div>
<div class="board">
<section class="col"><h2>🔴 PENDENTES</h2><div id="p"></div></section>
<section class="col"><h2>🟡 EM ANDAMENTO</h2><div id="d"></div></section>
<section class="col"><h2>🟢 CONCLUÍDAS</h2><div id="c"></div></section>
</div></div></div>
<div id="modal" class="modal"><div class="box"><h2>Nova tarefa</h2>
<label>Tarefa</label><input id="title" placeholder="Ex.: Criar anúncio do Onix">
<label>Descrição</label><textarea id="desc" rows="3"></textarea>
<label>Responsável</label><select id="assignee"><option>Luisa</option><option>Enzo</option></select>
<label>Prazo</label><input id="due" type="date">
<label>Prioridade</label><select id="priority"><option value="high">Alta</option><option value="medium" selected>Média</option><option value="low">Baixa</option></select>
<div style="display:flex;gap:8px;justify-content:flex-end"><button class="ghost" onclick="closeM()">Cancelar</button><button class="primary" onclick="createTask()">Criar tarefa</button></div>
</div></div>
<script>
const API="https://wjtgijnkksxgvsyohypk.supabase.co/functions/v1/tarefas-luisa-enzo";
let token=localStorage.getItem("tl_token"), me=localStorage.getItem("tl_user"), tasks=[], timer;
const $=id=>document.getElementById(id);
async function req(path,opt={}){opt.headers={...(opt.headers||{}),"Content-Type":"application/json",...(token?{"Authorization":"Bearer "+token}:{})};const r=await fetch(API+path,opt);const x=await r.json();if(r.status===401){logout();throw Error(x.error||"Sessão expirada")}if(!r.ok)throw Error(x.error||"Erro");return x}
async function doLogin(){try{const x=await req("/login",{method:"POST",body:JSON.stringify({user:$("user").value,password:$("pass").value})});token=x.token;me=x.user;localStorage.setItem("tl_token",token);localStorage.setItem("tl_user",me);show()}catch(e){$("msg").textContent=e.message}}
function show(){$("login").style.display="none";$("app").style.display="block";$("who").textContent=me;$("assignee").value=me;load();clearInterval(timer);timer=setInterval(load,3000)}
function logout(){localStorage.removeItem("tl_token");localStorage.removeItem("tl_user");location.reload()}
async function load(){try{tasks=await req("/tasks");render()}catch(e){}}
function openM(){$("modal").classList.add("show")}function closeM(){$("modal").classList.remove("show")}
async function createTask(){try{const title=$("title").value.trim();if(!title)return alert("Digite a tarefa.");await req("/tasks",{method:"POST",body:JSON.stringify({title,description:$("desc").value,assignee:$("assignee").value,due_date:$("due").value||null,priority:$("priority").value,status:"pending",created_by:me})});$("title").value="";$("desc").value="";$("due").value="";closeM();load()}catch(e){alert(e.message)}}
async function status(id,s){try{await req("/tasks/"+id,{method:"PATCH",body:JSON.stringify({status:s})});load()}catch(e){alert(e.message)}}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function card(t){let n=t.status==="pending"?"doing":t.status==="doing"?"done":"pending",l=t.status==="pending"?"Iniciar":t.status==="doing"?"Concluir":"Reabrir";return `<div class="card ${t.priority}"><div class="title">${esc(t.title)}</div>${t.description?`<div class="meta">${esc(t.description)}</div>`:""}<div class="meta">Responsável: <b>${esc(t.assignee)}</b>${t.due_date?" · Prazo: "+esc(t.due_date):""}</div><div class="actions"><button class="ghost" onclick="status('${t.id}','${n}')">${l}</button>${t.status!=="pending"?`<button class="ghost" onclick="status('${t.id}','pending')">Pendente</button>`:""}</div></div>`}
function render(){let p=tasks.filter(x=>x.status==="pending"),d=tasks.filter(x=>x.status==="doing"),c=tasks.filter(x=>x.status==="done");$("p").innerHTML=p.map(card).join("")||'<p class="muted">Nada pendente.</p>';$("d").innerHTML=d.map(card).join("")||'<p class="muted">Nada em andamento.</p>';$("c").innerHTML=c.map(card).join("")||'<p class="muted">Nada concluído.</p>';$("all").textContent=tasks.length;$("pn").textContent=p.length;$("dn").textContent=d.length;$("cn").textContent=c.length}
if(token&&me)show();
</script></body></html>
