name: DUOTask
options:
  bundleIdPrefix: com.duotask
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  DUOTaskApp:
    type: application
    platform: iOS
    sources:
      - DUOTaskApp
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duotask.app
        INFOPLIST_KEY_CFBundleDisplayName: "DUO Task"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: DUOTaskApp/DUOTaskApp.entitlements
    entitlements:
      path: DUOTaskApp/DUOTaskApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.duotask.shared
    dependencies:
      - target: DUOTaskWidget
        embed: true

  DUOTaskWidget:
    type: app-extension
    platform: iOS
    sources:
      - DUOTaskWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duotask.app.widget
        INFOPLIST_FILE: DUOTaskWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: DUOTaskWidget/DUOTaskWidget.entitlements
    entitlements:
      path: DUOTaskWidget/DUOTaskWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.duotask.shared
